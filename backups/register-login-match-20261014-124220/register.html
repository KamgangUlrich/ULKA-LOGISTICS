```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | ULKA LOGISTICS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="blue-redesign.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f6fb;
      color: #1d2b42;
      font-family: Arial, sans-serif;
    }

    .register-box {
      box-sizing: border-box;
      width: 100%;
      max-width: 420px;
      margin: 24px auto;
      padding: 30px;
      border: 1px solid #e2e8f2;
      border-radius: 15px;
      background: #ffffff;
      box-shadow: 0 8px 28px rgba(16, 38, 74, 0.10);
    }

    .register-box h1 {
      margin-top: 0;
      text-align: center;
      color: #10264a;
    }

    .register-box h2 {
      margin-bottom: 24px;
      text-align: center;
      color: #2563eb;
    }

    .register-box label {
      display: block;
      margin-bottom: 6px;
      color: #1d2b42;
      font-weight: 600;
    }

    .register-box input {
      display: block;
      box-sizing: border-box;
      width: 100%;
      min-height: 44px;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #d7e1ef;
      border-radius: 8px;
      background: #ffffff;
      color: #1d2b42;
      font: inherit;
    }

    .register-box input:focus {
      outline: 2px solid rgba(37, 99, 235, 0.18);
      border-color: #2563eb;
    }

    .register-box button {
      box-sizing: border-box;
      width: 100%;
      min-height: 44px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .register-box button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .register-box button:disabled {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .register-box a {
      color: #2563eb;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .register-box {
        padding: 22px;
      }
    }
  </style>
</head>
<body>

  <div class="register-box">
    <h1>ULKA LOGISTICS</h1>
    <h2>Create Your Account</h2>

    <form id="registerForm">
      <label for="fullName">Full Name</label>
      <input id="fullName" name="fullName"
             type="text" required minlength="2" maxlength="100">

      <label for="email">Email Address</label>
      <input id="email" name="email"
             type="email" required>

      <label for="phone">Phone Number (optional)</label>
      <input id="phone" name="phone" type="tel"
             autocomplete="tel" placeholder="+971 50 123 4567">


      <label for="password">Password</label>
      <input id="password" name="password"
             type="password" required minlength="12" maxlength="72">

      <button type="submit" id="registerButton">
        CREATE ACCOUNT
      </button>
    </form>

    <p id="message" role="status"></p>

    <p>Already registered? <a href="/login-redesign.html">Login here</a></p>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.textContent = "";
      button.disabled = true;
      button.textContent = "Creating account...";

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const phone = document.getElementById("phone").value.trim();

      try {
        const response = await fetch("/api/customers/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ fullName, email, password, phone })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Registration failed.");
        }

        message.style.color = "green";
        message.textContent =
          "Account created successfully! You can now log in.";
        form.reset();

      } catch (error) {
        message.style.color = "red";
        message.textContent =
          error.message || "Unable to connect to the server.";
      } finally {
        button.disabled = false;
        button.textContent = "CREATE ACCOUNT";
      }
    });
  </script>

</body>
</html>
```
