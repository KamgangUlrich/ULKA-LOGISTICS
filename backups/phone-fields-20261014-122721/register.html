```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | ULKA LOGISTICS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .register-box {
      max-width: 420px;
      margin: 60px auto;
      padding: 30px;
      border: 2px solid #eb25a6;
      border-radius: 15px;
      background: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .register-box h1 {
      text-align: center;
      color: #eb25a6;
    }

    .register-box input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .register-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #eb25a6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="register-box">
    <h1>ULKA LOGISTICS</h1>
    <h2>Create Your Account</h2>

    <form id="registerForm">
      <label for="fullName">Full Name</label>
      <input id="fullName" name="fullName"
             type="text" required minlength="2" maxlength="100">

      <label for="email">Email Address</label>
      <input id="email" name="email"
             type="email" required>

      <label for="password">Password</label>
      <input id="password" name="password"
             type="password" required minlength="12" maxlength="72">

      <button type="submit" id="registerButton">
        CREATE ACCOUNT
      </button>
    </form>

    <p id="message" role="status"></p>

    <p>Already registered? <a href="/login-redesign.html">Login here</a></p>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.textContent = "";
      button.disabled = true;
      button.textContent = "Creating account...";

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/api/customers/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ fullName, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Registration failed.");
        }

        message.style.color = "green";
        message.textContent =
          "Account created successfully! You can now log in.";
        form.reset();

      } catch (error) {
        message.style.color = "red";
        message.textContent =
          error.message || "Unable to connect to the server.";
      } finally {
        button.disabled = false;
        button.textContent = "CREATE ACCOUNT";
      }
    });
  </script>

</body>
</html>
